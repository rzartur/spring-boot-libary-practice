<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Książek</title>
</head>
<body>

<h1>Lista Książek</h1>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Tytuł</th>
        <th>ISBN</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">123</td>
        <td th:text="${book.title}">Tytuł Testowy</td>
        <td th:text="${book.isbn}">ISBN Testowy</td>
    </tr>
    </tbody>
</table>

</body>
</html>
